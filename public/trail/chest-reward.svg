<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldChest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" />
      <stop offset="100%" stop-color="#799F0C" />
    </linearGradient>
    <linearGradient id="woodChest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#654ea3" />
      <stop offset="100%" stop-color="#eaafc8" />
    </linearGradient>
    <filter id="chestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <!-- Glow rays behind chest -->
  <g filter="url(#chestGlow)">
    <polygon points="60,60 50,10 70,10" fill="#FFE000" opacity="0.3" />
    <polygon points="60,60 100,30 110,45" fill="#FFE000" opacity="0.3" />
    <polygon points="60,60 10,30 20,45" fill="#FFE000" opacity="0.3" />
  </g>
  
  <!-- Chest Base -->
  <rect x="24" y="52" width="72" height="46" rx="8" fill="#1e1838" stroke="#00F0FF" stroke-width="2.5" />
  
  <!-- Chest Open Lid / Interior Glow -->
  <path d="M 20 52 C 20 32 36 26 60 26 C 84 26 100 32 100 52 Z" fill="#2d1c52" stroke="#FFD700" stroke-width="2.5" />
  <ellipse cx="60" cy="52" rx="34" ry="12" fill="#FFE000" opacity="0.8" />
  <ellipse cx="60" cy="52" rx="26" ry="7" fill="#FFFFFF" />
  
  <!-- Reinforcement gold bands -->
  <rect x="36" y="52" width="8" height="46" fill="#FFD700" />
  <rect x="76" y="52" width="8" height="46" fill="#FFD700" />
  <circle cx="40" cy="62" r="1.5" fill="#333" />
  <circle cx="40" cy="86" r="1.5" fill="#333" />
  <circle cx="80" cy="62" r="1.5" fill="#333" />
  <circle cx="80" cy="86" r="1.5" fill="#333" />
  
  <!-- Front Lock & Keyhole -->
  <rect x="52" y="48" width="16" height="18" rx="4" fill="#FFD700" stroke="#B8860B" stroke-width="1.5" />
  <circle cx="60" cy="55" r="2.5" fill="#1e1838" />
  <polygon points="59,56 61,56 62,62 58,62" fill="#1e1838" />
  
  <!-- Glowing Floating XP Orbs & Coins -->
  <circle cx="42" cy="30" r="5" fill="#00FFA3" filter="url(#chestGlow)" />
  <circle cx="78" cy="26" r="6" fill="#FF007F" filter="url(#chestGlow)" />
  <circle cx="60" cy="18" r="8" fill="#FFD700" filter="url(#chestGlow)" />
  <text x="60" y="22" font-size="9" font-family="sans-serif" font-weight="bold" fill="#7C4700" text-anchor="middle">🪙</text>
</svg>
