<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="30%" stop-color="#111827" />
      <stop offset="70%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#06121e" />
    </linearGradient>
    <linearGradient id="neonGrid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="islandGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="islandGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="islandGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="1200" fill="url(#cyberSky)" />

  <!-- Digital Circuit Matrix Grid Lines -->
  <g stroke="url(#neonGrid)" stroke-width="1.2">
    <!-- Horizontal matrix lanes -->
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="0" y1="600" x2="600" y2="600" />
    <line x1="0" y1="850" x2="600" y2="850" />
    <line x1="0" y1="1050" x2="600" y2="1050" />
    
    <!-- Vertical data buses -->
    <line x1="100" y1="0" x2="100" y2="1200" stroke-dasharray="8 12" />
    <line x1="300" y1="0" x2="300" y2="1200" stroke-dasharray="14 18" />
    <line x1="500" y1="0" x2="500" y2="1200" stroke-dasharray="8 12" />
  </g>

  <!-- Biome 1 (Top / Tier 4): Cidadela da Nuvem IoT & IA -->
  <circle cx="300" cy="180" r="180" fill="url(#islandGlow3)" />
  <rect x="220" y="80" width="160" height="50" rx="14" fill="#1b1035" stroke="#9D4EDD" stroke-width="2" opacity="0.85" />
  <text x="300" y="112" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" fill="#E0AAFF" text-anchor="middle">☁️ Tier IV: Nuvem IoT &amp; IA</text>

  <!-- Biome 2 (Tier 3): Vale da Robótica & Automação -->
  <circle cx="420" cy="480" r="160" fill="url(#islandGlow2)" />
  <rect x="340" y="400" width="180" height="46" rx="14" fill="#082032" stroke="#00F0FF" stroke-width="2" opacity="0.85" />
  <text x="430" y="429" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" fill="#A0E7E5" text-anchor="middle">🤖 Tier III: Robótica &amp; Motores</text>

  <!-- Biome 3 (Tier 2): Planalto dos Circuitos & Sensores -->
  <circle cx="180" cy="780" r="170" fill="url(#islandGlow1)" />
  <rect x="70" y="710" width="190" height="46" rx="14" fill="#0b291e" stroke="#00FFA3" stroke-width="2" opacity="0.85" />
  <text x="165" y="739" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" fill="#B7EFC5" text-anchor="middle">⚡ Tier II: Sensores &amp; LEDs</text>

  <!-- Biome 4 (Bottom / Tier 1): Porto de Entrada / Fundamentos Hacker -->
  <circle cx="300" cy="1080" r="180" fill="url(#islandGlow2)" />
  <rect x="200" y="1030" width="200" height="46" rx="14" fill="#0a192f" stroke="#00F0FF" stroke-width="2" opacity="0.85" />
  <text x="300" y="1059" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" fill="#64DFDF" text-anchor="middle">💻 Tier I: Lógica &amp; Algoritmos</text>

  <!-- Floating Data Nodes / Pixels -->
  <g fill="#00FFA3" opacity="0.6">
    <circle cx="120" cy="220" r="3" />
    <circle cx="480" cy="280" r="4" />
    <circle cx="150" cy="520" r="3.5" />
    <circle cx="530" cy="670" r="3" />
    <circle cx="90" cy="940" r="4" />
    <circle cx="490" cy="990" r="3" />
  </g>
</svg>
