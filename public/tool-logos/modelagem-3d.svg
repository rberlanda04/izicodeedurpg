<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cubeGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9966" />
    </linearGradient>
    <linearGradient id="cubeGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D27" />
      <stop offset="100%" stop-color="#B31217" />
    </linearGradient>
    <linearGradient id="cubeGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6249F" />
      <stop offset="100%" stop-color="#833AB4" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#14172b" />
  
  <!-- Isometric 3D Cube / Wireframe Model -->
  <!-- Top Face -->
  <polygon points="50,22 78,37 50,52 22,37" fill="url(#cubeGradTop)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Left Face -->
  <polygon points="22,37 50,52 50,82 22,67" fill="url(#cubeGradLeft)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Right Face -->
  <polygon points="50,52 78,37 78,67 50,82" fill="url(#cubeGradRight)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Internal wireframe mesh lines -->
  <line x1="36" y1="29.5" x2="64" y2="44.5" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  <line x1="64" y1="29.5" x2="36" y2="44.5" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  <line x1="36" y1="44.5" x2="36" y2="74.5" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  <line x1="64" y1="44.5" x2="64" y2="74.5" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  
  <!-- Corner vertices / 3D points -->
  <circle cx="50" cy="22" r="2.5" fill="#FFFFFF" />
  <circle cx="78" cy="37" r="2.5" fill="#FFFFFF" />
  <circle cx="22" cy="37" r="2.5" fill="#FFFFFF" />
  <circle cx="50" cy="52" r="2.5" fill="#FFFFFF" />
  <circle cx="22" cy="67" r="2.5" fill="#FFFFFF" />
  <circle cx="78" cy="67" r="2.5" fill="#FFFFFF" />
  <circle cx="50" cy="82" r="2.5" fill="#FFFFFF" />
</svg>
