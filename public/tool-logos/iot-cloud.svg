<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD200" />
      <stop offset="100%" stop-color="#F7971E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background shape -->
  <rect width="100" height="100" rx="22" fill="#0b132b" />
  
  <!-- Cloud Body -->
  <path d="M 32 64 L 68 64 C 77 64 84 57 84 48 C 84 40 78 33 70 32.2 C 68 20 57 14 46 16 C 37 18 30 25 30 34 C 22 35 16 41 16 49 C 16 57 23 64 32 64 Z" fill="url(#cloudGrad)" filter="url(#glow)"/>
  
  <!-- Embedded Microchip / IoT Symbol -->
  <rect x="42" y="38" width="16" height="16" rx="3" fill="url(#chipGrad)" />
  <circle cx="50" cy="46" r="3" fill="#0b132b" />
  
  <!-- Circuit pins -->
  <line x1="38" y1="42" x2="42" y2="42" stroke="#FFD200" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="50" x2="42" y2="50" stroke="#FFD200" stroke-width="2" stroke-linecap="round" />
  <line x1="58" y1="42" x2="62" y2="42" stroke="#FFD200" stroke-width="2" stroke-linecap="round" />
  <line x1="58" y1="50" x2="62" y2="50" stroke="#FFD200" stroke-width="2" stroke-linecap="round" />
  
  <!-- Signal waves below -->
  <path d="M 36 74 A 18 18 0 0 1 64 74" fill="none" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 42 80 A 10 10 0 0 1 58 80" fill="none" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="85" r="2" fill="#00D2FF" />
</svg>
