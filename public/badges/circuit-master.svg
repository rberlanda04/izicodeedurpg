<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="badgeG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#007CF0" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00FFA3" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Outer Shield -->
  <polygon points="60,6 108,24 108,70 60,114 12,70 12,24" fill="url(#badgeG2)" filter="url(#glowGreen)" />
  <polygon points="60,14 100,29 100,66 60,103 20,66 20,29" fill="#0c1a1a" stroke="#00FFA3" stroke-width="2" />
  
  <!-- Microcontroller / Microchip -->
  <rect x="42" y="42" width="36" height="36" rx="4" fill="#004D40" stroke="#00FFA3" stroke-width="2" />
  <circle cx="60" cy="60" r="8" fill="#00FFA3" opacity="0.3" />
  <circle cx="60" cy="60" r="4" fill="#00FFA3" />
  
  <!-- Chip Pins -->
  <line x1="48" y1="36" x2="48" y2="42" stroke="#00FFA3" stroke-width="2" />
  <line x1="60" y1="36" x2="60" y2="42" stroke="#00FFA3" stroke-width="2" />
  <line x1="72" y1="36" x2="72" y2="42" stroke="#00FFA3" stroke-width="2" />
  <line x1="48" y1="78" x2="48" y2="84" stroke="#00FFA3" stroke-width="2" />
  <line x1="60" y1="78" x2="60" y2="84" stroke="#00FFA3" stroke-width="2" />
  <line x1="72" y1="78" x2="72" y2="84" stroke="#00FFA3" stroke-width="2" />
  <line x1="36" y1="48" x2="42" y2="48" stroke="#00FFA3" stroke-width="2" />
  <line x1="36" y1="60" x2="42" y2="60" stroke="#00FFA3" stroke-width="2" />
  <line x1="36" y1="72" x2="42" y2="72" stroke="#00FFA3" stroke-width="2" />
  <line x1="78" y1="48" x2="84" y2="48" stroke="#00FFA3" stroke-width="2" />
  <line x1="78" y1="60" x2="84" y2="60" stroke="#00FFA3" stroke-width="2" />
  <line x1="78" y1="72" x2="84" y2="72" stroke="#00FFA3" stroke-width="2" />
</svg>
