<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="badgeG3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF416C" flood-opacity="0.4" />
    </filter>
  </defs>
  <polygon points="60,6 108,24 108,70 60,114 12,70 12,24" fill="url(#badgeG3)" filter="url(#glowOrange)" />
  <polygon points="60,14 100,29 100,66 60,103 20,66 20,29" fill="#1f1118" stroke="#FF416C" stroke-width="2" />
  
  <!-- Robot Head -->
  <rect x="40" y="44" width="40" height="34" rx="8" fill="#2d1c2d" stroke="#FF9900" stroke-width="2" />
  <!-- Robot Antenna -->
  <line x1="60" y1="36" x2="60" y2="44" stroke="#FF9900" stroke-width="2.5" />
  <circle cx="60" cy="34" r="3.5" fill="#FF416C" />
  <!-- Robot Eyes -->
  <circle cx="50" cy="56" r="4.5" fill="#00FFA3" />
  <circle cx="70" cy="56" r="4.5" fill="#00FFA3" />
  <!-- Robot Mouth Grid -->
  <line x1="48" y1="68" x2="72" y2="68" stroke="#FF9900" stroke-width="2" stroke-linecap="round" />
  <line x1="54" y1="66" x2="54" y2="70" stroke="#FF9900" stroke-width="1.5" />
  <line x1="60" y1="66" x2="60" y2="70" stroke="#FF9900" stroke-width="1.5" />
  <line x1="66" y1="66" x2="66" y2="70" stroke="#FF9900" stroke-width="1.5" />
  <!-- Robot Ears / Bolts -->
  <rect x="36" y="54" width="4" height="8" rx="1" fill="#FF9900" />
  <rect x="80" y="54" width="4" height="8" rx="1" fill="#FF9900" />
</svg>
