<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="badgeG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00F0FF" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Outer Shield -->
  <polygon points="60,6 108,24 108,70 60,114 12,70 12,24" fill="url(#badgeG1)" filter="url(#glowBadge)" />
  <!-- Inner Shield -->
  <polygon points="60,14 100,29 100,66 60,103 20,66 20,29" fill="#0c1021" stroke="#00F0FF" stroke-width="2" />
  
  <!-- Terminal / Code Prompt -->
  <rect x="32" y="38" width="56" height="42" rx="6" fill="#151b36" stroke="#7000FF" stroke-width="1.5" />
  <circle cx="39" cy="45" r="2" fill="#FF5F56" />
  <circle cx="45" cy="45" r="2" fill="#FFBD2E" />
  <circle cx="51" cy="45" r="2" fill="#27C93F" />
  
  <!-- Code brackets & cursor -->
  <path d="M 42 56 L 48 61 L 42 66" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="53" y1="66" x2="63" y2="66" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Stars -->
  <polygon points="60,18 62,23 67,23 63,26 65,31 60,28 55,31 57,26 53,23 58,23" fill="#FFD700" />
