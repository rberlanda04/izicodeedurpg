<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="auto">
  <defs>
    <linearGradient id="aiGlitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
    <filter id="glitchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FF0080" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Holographic Distortion Rings -->
  <circle cx="250" cy="180" r="140" fill="none" stroke="#7928CA" stroke-width="2" stroke-dasharray="10 8" opacity="0.4" />
  <circle cx="250" cy="180" r="110" fill="none" stroke="#FF0080" stroke-width="2.5" stroke-dasharray="20 12" opacity="0.6" />
  <circle cx="250" cy="180" r="80" fill="none" stroke="#00DFD8" stroke-width="3" stroke-dasharray="5 5" />

  <!-- Central AI Glitch Core (Octagon) -->
  <polygon points="250,70 328,102 360,180 328,258 250,290 172,258 140,180 172,102" fill="#0E0520" stroke="url(#aiGlitchGrad)" stroke-width="4" filter="url(#glitchGlow)" />

  <!-- Inner Cyber Eye / Sensor Array -->
  <circle cx="250" cy="180" r="45" fill="#180B33" stroke="#00DFD8" stroke-width="3" />
  <circle cx="250" cy="180" r="28" fill="#FF0080" filter="url(#glitchGlow)" />
  <circle cx="250" cy="180" r="12" fill="#FFFFFF" />

  <!-- Floating Glitch Pixels / Data Fragments -->
  <rect x="90" y="110" width="40" height="8" fill="#00DFD8" opacity="0.8" />
  <rect x="70" y="140" width="30" height="6" fill="#FF0080" opacity="0.7" />
  <rect x="370" y="120" width="50" height="10" fill="#FF0080" opacity="0.8" />
  <rect x="390" y="210" width="35" height="7" fill="#00DFD8" opacity="0.7" />
  <rect x="180" y="300" width="60" height="8" fill="#7928CA" opacity="0.8" />
  <rect x="270" y="315" width="45" height="6" fill="#00DFD8" opacity="0.8" />

  <!-- Code Warning Overlays -->
  <text x="250" y="50" font-family="Courier, monospace" font-weight="bold" font-size="16" fill="#FF0080" text-anchor="middle" letter-spacing="4">&lt;SYSTEM OVERRIDE: G.L.I.T.C.H.&gt;</text>
  <text x="250" y="345" font-family="Courier, monospace" font-size="12" fill="#00DFD8" text-anchor="middle">ERROR 0x7F // THREAT LEVEL: S-RANK</text>
</svg>
