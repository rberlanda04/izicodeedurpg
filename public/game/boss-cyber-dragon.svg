<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="auto">
  <defs>
    <linearGradient id="bossArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D112B" />
      <stop offset="50%" stop-color="#541A3E" />
      <stop offset="100%" stop-color="#190616" />
    </linearGradient>
    <linearGradient id="bossFire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0844" />
      <stop offset="50%" stop-color="#FFB199" />
      <stop offset="100%" stop-color="#FF0844" />
    </linearGradient>
    <linearGradient id="neonLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="bossGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF0844" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Atmospheric Aura -->
  <radialGradient id="bossAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF0844" stop-opacity="0.3" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
  </radialGradient>
  <ellipse cx="250" cy="180" rx="230" ry="160" fill="url(#bossAura)" />

  <!-- Mechanical Wings -->
  <!-- Left Wing -->
  <polygon points="210,130 90,60 130,140 50,110 100,190 190,170" fill="#1C091A" stroke="#FF0844" stroke-width="2.5" />
  <line x1="90" y1="60" x2="190" y2="170" stroke="#00F0FF" stroke-width="2" />
  <line x1="50" y1="110" x2="190" y2="170" stroke="#00F0FF" stroke-width="2" />

  <!-- Right Wing -->
  <polygon points="290,130 410,60 370,140 450,110 400,190 310,170" fill="#1C091A" stroke="#FF0844" stroke-width="2.5" />
  <line x1="410" y1="60" x2="310" y2="170" stroke="#00F0FF" stroke-width="2" />
  <line x1="450" y1="110" x2="310" y2="170" stroke="#00F0FF" stroke-width="2" />

  <!-- Main Cyber Torso / Armor -->
  <polygon points="250,100 310,150 290,260 250,290 210,260 190,150" fill="url(#bossArmor)" stroke="#FF0844" stroke-width="3" />

  <!-- Glowing Reactor Core -->
  <circle cx="250" cy="200" r="32" fill="#110515" stroke="#FF0844" stroke-width="3" />
  <circle cx="250" cy="200" r="22" fill="url(#bossFire)" filter="url(#bossGlow)" />
  <circle cx="250" cy="200" r="10" fill="#FFFFFF" />

  <!-- Armored Cyber Shoulders -->
  <polygon points="180,120 220,110 200,170 160,150" fill="#3D1233" stroke="#00FFA3" stroke-width="2" />
  <polygon points="320,120 280,110 300,170 340,150" fill="#3D1233" stroke="#00FFA3" stroke-width="2" />

  <!-- Dragon Head / Helmet -->
  <polygon points="250,40 285,90 265,130 250,145 235,130 215,90" fill="#1C091A" stroke="#FF0844" stroke-width="3" />
  <!-- Horns -->
  <polygon points="225,80 180,30 215,65" fill="#541A3E" stroke="#FF0844" stroke-width="2" />
  <polygon points="275,80 320,30 285,65" fill="#541A3E" stroke="#FF0844" stroke-width="2" />

  <!-- Glowing Eyes -->
  <polygon points="230,85 242,92 232,96" fill="#00FFA3" filter="url(#bossGlow)" />
  <polygon points="270,85 258,92 268,96" fill="#00FFA3" filter="url(#bossGlow)" />

  <!-- Cyber Tail with Plasma Blade -->
  <path d="M 250 290 Q 250 340 320 330 Q 360 320 380 340" fill="none" stroke="#FF0844" stroke-width="6" stroke-linecap="round" />
  <polygon points="380,340 420,335 395,355" fill="#00FFA3" filter="url(#bossGlow)" />

  <!-- Tech Panels & Circuit Lines -->
  <line x1="220" y1="240" x2="240" y2="255" stroke="#00F0FF" stroke-width="2" />
  <line x1="280" y1="240" x2="260" y2="255" stroke="#00F0FF" stroke-width="2" />
</svg>
